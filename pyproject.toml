[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "pynndescent"
version = "0.8.0"
authors = [{name = "Leland McInnes", email = "leland.mcinnes@gmail.com"}]
maintainers = [{name = "Leland McInnes", email = "leland.mcinnes@gmail.com"}]
license = "BSD-2-Clause"
description = "Nearest Neighbor Descent"
keywords = ["nearest", "neighbor", "knn", "ANN"]
readme = "README.rst"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
urls = {Homepage = "http://github.com/lmcinnes/pynndescent"}
dependencies = [
    "numpy >= 1.23",
    "scikit-learn >= 1.1",
    "scipy >= 1.9",
    "numba >= 0.57",
    "llvmlite >= 0.40",
    "joblib >= 0.11",
]

[dependency-groups]
testing = ["pytest"]
cicd = ["pytest-cov", {include-group="testing"}]

[tool.setuptools]
packages = ["pynndescent"]
zip-safe = false
include-package-data = false
